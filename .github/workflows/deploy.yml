name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_WEDDING_FORM_URL: ${{ secrets.NEXT_PUBLIC_WEDDING_FORM_URL || '' }}
      NEXT_PUBLIC_PET_FORM_URL: ${{ secrets.NEXT_PUBLIC_PET_FORM_URL || '' }}
      NEXT_PUBLIC_FORMSPREE_ART_CONTACT_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_ART_CONTACT_ID }}
      NEXT_PUBLIC_FORMSPREE_WEDDINGS_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_WEDDINGS_ID }}
      NEXT_PUBLIC_FORMSPREE_BABY_FAMILY_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_BABY_FAMILY_ID }}
      NEXT_PUBLIC_FORMSPREE_HEADSHOTS_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_HEADSHOTS_ID }}
      NEXT_PUBLIC_FORMSPREE_PETS_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_PETS_ID }}
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Check for accidentally committed credentials
        run: node scripts/check-secrets.js

      - name: Check bilingual translation coverage
        run: npm run check:translations

      - name: Create images directory
        run: mkdir -p public/images

      - name: Build Next.js site
        run: npm run build

      - name: Check exported pages
        run: npm run check:site

      - name: Add .nojekyll file
        run: touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4