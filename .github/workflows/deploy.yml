name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_WEDDING_FORM_URL: ${{ secrets.NEXT_PUBLIC_WEDDING_FORM_URL || '' }}
      NEXT_PUBLIC_PET_FORM_URL: ${{ secrets.NEXT_PUBLIC_PET_FORM_URL || '' }}
      NEXT_PUBLIC_FORMSPREE_ART_CONTACT_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_ART_CONTACT_ID || '' }}
      NEXT_PUBLIC_FORMSPREE_WEDDINGS_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_WEDDINGS_ID || 'xbdqyvqj' }}
      NEXT_PUBLIC_FORMSPREE_BABY_FAMILY_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_BABY_FAMILY_ID || 'xeevkbvp' }}
      NEXT_PUBLIC_FORMSPREE_HEADSHOTS_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_HEADSHOTS_ID || 'xpqkrgkn' }}
      NEXT_PUBLIC_FORMSPREE_PETS_ID: ${{ secrets.NEXT_PUBLIC_FORMSPREE_PETS_ID || 'xvzdrjdj' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Create images directory
        run: mkdir -p public/images

      - name: Build Next.js site
        run: npm run build

      - name: Add .nojekyll file
        run: touch ./out/.nojekyll

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4