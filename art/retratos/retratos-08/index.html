nt and belonging. These works explore the space between leaving and arriving, between home and journey.\",\"canonical\":\"https://www.camilalonart.com/art/carrying-home/\"},\"es\":{\"title\":\"Carrying Home — Camila Londoño\",\"description\":\"Una meditación sobre el desplazamiento y el sentido de pertenencia. Estas obras exploran el espacio entre partir y llegar, entre el hogar y el camino.\",\"canonical\":\"https://www.camilalonart.com/es/art/carrying-home/\"}},\"/art/dear-inner-child\":{\"en\":{\"title\":\"Dear Inner Child — Camila Londoño\",\"description\":\"A remembrance of the person we were before the world taught us how to be.\",\"canonical\":\"https://www.camilalonart.com/art/dear-inner-child/\"},\"es\":{\"title\":\"Dear Inner Child — Camila Londoño\",\"description\":\"Un recuerdo de la persona que éramos antes de que el mundo nos enseñara cómo ser.\",\"canonical\":\"https://www.camilalonart.com/es/art/dear-inner-child/\"}},\"/art/magic\":{\"en\":{\"title\":\"Magic — Camila Londoño\",\"description\":\"Finding wonder in ordinary spaces.\",\"canonical\":\"https://www.camilalonart.com/art/magic/\"},\"es\":{\"title\":\"Magic — Camila Londoño\",\"description\":\"Encontrando maravilla en los espacios cotidianos.\",\"canonical\":\"https://www.camilalonart.com/es/art/magic/\"}},\"/art/the-essential-is-invisible\":{\"en\":{\"title\":\"The Essential is Invisible (Red) — Camila Londoño\",\"description\":\"A suite of works exploring emotional intensity, complexity, and the hidden depths beneath surface appearances. The red doodles are the stories we carry within, the feelings that shape us but often go unseen.\",\"canonical\":\"https://www.camilalonart.com/art/the-essential-is-invisible/\"},\"es\":{\"title\":\"The Essential is Invisible (Red) — Camila Londoño\",\"description\":\"Una serie de obras que exploran la intensidad emocional, la complejidad y las profundidades ocultas bajo las apariencias. Los garabatos rojos son las historias que llevamos dentro, los sentimientos que nos forman pero que a menudo no se ven.\",\"canonical\":\"https://www.camilalonart.com/es/art/the-essential-is-invisible/\"}},\"/art/siempre-vuelvo\":{\"en\":{\"title\":\"Siempre vuelvo a esta versión de mi — Camila Londoño\",\"description\":\"Paintings made when I was 17, feeling on top of the world, feeling everything was fine, and finding excitment in everything. Naive and romantic Camila, I always come back to you, to the way you see the world, to the way you feel. These paintings are a love letter to that version of myself, and a reminder that we carry all our versions within us.\",\"canonical\":\"https://www.camilalonart.com/art/siempre-vuelvo/\"},\"es\":{\"title\":\"Siempre vuelvo a esta versión de mi — Camila Londoño\",\"description\":\"Pinturas hechas cuando tenía 17 años, sintiéndome en la cima del mundo, sintiéndome que todo estaba bien y encontrando emoción en todo. Camila ingenua y romántica, siempre vuelvo a ti, a la forma en que ves el mundo, a la forma en que sientes. Estas pinturas son una carta de amor a esa versión de mí misma, y un recordatorio de que llevamos todas nuestras versiones dentro de nosotros.\",\"canonical\":\"https://www.camilalonart.com/es/art/siempre-vuelvo/\"}},\"/art/in-your-eyes\":{\"en\":{\"title\":\"In Your Eyes — Camila Londoño\",\"description\":\"They say the eyes are the window to the soul. These paintings explore the stories we carry in our gaze, the way we see ourselves and others, and the emotions that flicker behind our eyes.\",\"canonical\":\"https://www.camilalonart.com/art/in-your-eyes/\"},\"es\":{\"title\":\"In Your Eyes — Camila Londoño\",\"description\":\"Dicen que los ojos son la ventana del alma. Estas pinturas exploran las historias que llevamos en la mirada, la forma en que nos vemos a nosotros mismos y a los demás, y las emociones que parpadean detrás de los ojos.\",\"canonical\":\"https://www.camilalonart.com/es/art/in-your-eyes/\"}},\"/art/yellow\":{\"en\":{\"title\":\"Yellow — Camila Londoño\",\"description\":\"I love yellow. These works are studies I did as a teen, and I always come back to the way I experienced art back then. Drawing thousands of art pieces, obsessed with the process of making.\",\"canonical\":\"https://www.camilalonart.com/art/yellow/\"},\"es\":{\"title\":\"Yellow — Camila Londoño\",\"description\":\"Amo el amarillo. Estas obras son estudios que hice de adolescente, y siempre regreso a la forma en que experimentaba el arte entonces. Dibujando miles de piezas, obsesionada con el proceso de crear.\",\"canonical\":\"https://www.camilalonart.com/es/art/yellow/\"}},\"/art/perspective\":{\"en\":{\"title\":\"Perspective — Camila Londoño\",\"description\":\"Geometry and not taking it too seriously. An exploration of perspective as a way to play with space, form, and the way we see the world.\",\"canonical\":\"https://www.camilalonart.com/art/perspective/\"},\"es\":{\"title\":\"Perspective — Camila Londoño\",\"description\":\"Geometría sin tomársela demasiado en serio. Una exploración de la perspectiva como forma de jugar con el espacio, la forma y la manera en que vemos el mundo.\",\"canonical\":\"https://www.camilalonart.com/es/art/perspective/\"}},\"/art/pandemic-lockdown\":{\"en\":{\"title\":\"Pandemic Lockdown — Camila Londoño\",\"description\":\"Works created during isolation. A documentation of interior life, and the way confinement can sharpen perception.\",\"canonical\":\"https://www.camilalonart.com/art/pandemic-lockdown/\"},\"es\":{\"title\":\"Pandemic Lockdown — Camila Londoño\",\"description\":\"Obras creadas durante el aislamiento. Una documentación de la vida interior y de cómo el confinamiento puede agudizar la percepción.\",\"canonical\":\"https://www.camilalonart.com/es/art/pandemic-lockdown/\"}},\"/art/mis-raices\":{\"en\":{\"title\":\"Mis Raíces — Camila Londoño\",\"description\":\"A return to origins. Works celebrating family, landscape, coffee, and the birds that inhabit the mountains of Colombia.\",\"canonical\":\"https://www.camilalonart.com/art/mis-raices/\"},\"es\":{\"title\":\"Mis Raíces — Camila Londoño\",\"description\":\"Un regreso a los orígenes. Obras que celebran la familia, el paisaje, el café y los pájaros que habitan las montañas de Colombia.\",\"canonical\":\"https://www.camilalonart.com/es/art/mis-raices/\"}},\"/art/blanco-y-negro\":{\"en\":{\"title\":\"Blanco y Negro — Camila Londoño\",\"description\":\"Studies in contrast and simplicity. Black and white as a way to strip down to essence, to find form in its purest state.\",\"canonical\":\"https://www.camilalonart.com/art/blanco-y-negro/\"},\"es\":{\"title\":\"Blanco y Negro — Camila Londoño\",\"description\":\"Estudios en contraste y simplicidad. El blanco y negro como forma de reducir a lo esencial, de encontrar la forma en su estado más puro.\",\"canonical\":\"https://www.camilalonart.com/es/art/blanco-y-negro/\"}},\"/art/red-doodles\":{\"en\":{\"title\":\"Red Doodles — Camila Londoño\",\"description\":\"Spontaneous marks and studies. Sketchbook pages that celebrate the joy of line and color without the weight of intention.\",\"canonical\":\"https://www.camilalonart.com/art/red-doodles/\"},\"es\":{\"title\":\"Red Doodles — Camila Londoño\",\"description\":\"Trazos espontáneos y estudios. Páginas de cuaderno que celebran la alegría del trazo y el color sin el peso de la intención.\",\"canonical\":\"https://www.camilalonart.com/es/art/red-doodles/\"}},\"/art/dibujitos-para-will\":{\"en\":{\"title\":\"Dibujitos Para Will — Camila Londoño\",\"description\":\"A small series of drawings made with love for Will.\",\"canonical\":\"https://www.camilalonart.com/art/dibujitos-para-will/\"},\"es\":{\"title\":\"Dibujitos Para Will — Camila Londoño\",\"description\":\"Una pequeña serie de dibujitos hechos con cariño para Will.\",\"canonical\":\"https://www.camilalonart.com/es/art/dibujitos-para-will/\"}},\"/art/fuego-interior\":{\"en\":{\"title\":\"Fuego Interior — Camila Londoño\",\"description\":\"Fuego Interior, a painting collection by Camila Londoño.\",\"canonical\":\"https://www.camilalonart.com/art/fuego-interior/\"},\"es\":{\"title\":\"Fuego Interior — Camila Londoño\",\"description\":\"Fuego Interior, una colección de pinturas de Camila Londoño.\",\"canonical\":\"https://www.camilalonart.com/es/art/fuego-interior/\"}},\"/art/colorful\":{\"en\":{\"title\":\"Colorful — Camila Londoño\",\"description\":\"Vibrant works in marker exploring bold color and expressive line.\",\"canonical\":\"https://www.camilalonart.com/art/colorful/\"},\"es\":{\"title\":\"Colorful — Camila Londoño\",\"description\":\"Obras vibrantes en marcador que exploran el color intenso y la línea expresiva.\",\"canonical\":\"https://www.camilalonart.com/es/art/colorful/\"}},\"/art/otros\":{\"en\":{\"title\":\"Otros — Camila Londoño\",\"description\":\"A collection of works that don't fit neatly into a single series — experiments, gifts, and quiet observations.\",\"canonical\":\"https://www.camilalonart.com/art/otros/\"},\"es\":{\"title\":\"Otros — Camila Londoño\",\"description\":\"Una colección de obras que no encajan en una sola serie: experimentos, regalos y observaciones tranquilas.\",\"canonical\":\"https://www.camilalonart.com/es/art/otros/\"}},\"/art/acuarelapapelamarillo\":{\"en\":{\"title\":\"AcuarelaPapelAmarillo — Camila Londoño\",\"description\":\"Something\",\"canonical\":\"https://www.camilalonart.com/art/acuarelapapelamarillo/\"},\"es\":{\"title\":\"AcuarelaPapelAmarillo — Camila Londoño\",\"description\":\"Algo\",\"canonical\":\"https://www.camilalonart.com/es/art/acuarelapapelamarillo/\"}},\"/art/color\":{\"en\":{\"title\":\"Color — Camila Londoño\",\"description\":\"Something\",\"canonical\":\"https://www.camilalonart.com/art/color/\"},\"es\":{\"title\":\"Color — Camila Londoño\",\"description\":\"Algo\",\"canonical\":\"https://www.camilalonart.com/es/art/color/\"}},\"/art/cuerpos\":{\"en\":{\"title\":\"Cuerpos — Camila Londoño\",\"description\":\"Something\",\"canonical\":\"https://www.camilalonart.
